<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" font-family="monospace" font-size="13">
  <!-- Iteration 1 -->
  <rect x="10" y="30" width="180" height="170" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="55" y="52" font-size="13" font-weight="bold" fill="#333">Iteration 1</text>

  <rect x="25" y="65" width="150" height="38" rx="4" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="35" y="80" font-size="11" fill="#333">Seq A:</text>
  <text x="85" y="80" font-size="11" font-weight="bold" fill="#1565c0">[PREFILL]</text>
  <text x="35" y="94" font-size="10" fill="#666">处理 prompt</text>

  <rect x="25" y="113" width="150" height="32" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="35" y="125" font-size="11" fill="#333">Seq B:</text>
  <text x="85" y="125" font-size="11" fill="#999">(waiting)</text>

  <rect x="25" y="153" width="150" height="32" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="35" y="165" font-size="11" fill="#333">Seq C:</text>
  <text x="85" y="165" font-size="11" fill="#999">(waiting)</text>

  <!-- Arrow 1→2 -->
  <line x1="195" y1="115" x2="215" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Iteration 2 -->
  <rect x="220" y="30" width="180" height="170" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="265" y="52" font-size="13" font-weight="bold" fill="#333">Iteration 2</text>

  <rect x="235" y="65" width="150" height="38" rx="4" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="245" y="80" font-size="11" fill="#333">Seq A:</text>
  <text x="295" y="80" font-size="11" font-weight="bold" fill="#2e7d32">[DECODE]</text>
  <text x="245" y="94" font-size="10" fill="#666">逐 token 生成</text>

  <rect x="235" y="113" width="150" height="38" rx="4" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="245" y="128" font-size="11" fill="#333">Seq B:</text>
  <text x="295" y="128" font-size="11" font-weight="bold" fill="#1565c0">[PREFILL]</text>
  <text x="245" y="141" font-size="10" fill="#666">刚补进来</text>

  <rect x="235" y="153" width="150" height="32" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="245" y="165" font-size="11" fill="#333">Seq C:</text>
  <text x="295" y="165" font-size="11" fill="#999">(waiting)</text>

  <!-- Arrow 2→3 -->
  <line x1="405" y1="115" x2="425" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Iteration 3 -->
  <rect x="430" y="30" width="160" height="170" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="475" y="52" font-size="13" font-weight="bold" fill="#333">Iteration 3</text>

  <rect x="445" y="65" width="135" height="38" rx="4" fill="#fce4ec" stroke="#e91e63"/>
  <text x="455" y="80" font-size="11" fill="#333">Seq A:</text>
  <text x="505" y="80" font-size="11" font-weight="bold" fill="#c62828">[DONE]</text>
  <text x="455" y="94" font-size="10" fill="#666">跑完，踢掉 ✅</text>

  <rect x="445" y="113" width="135" height="38" rx="4" fill="#e8f5e9" stroke="#4caf50"/>
  <text x="455" y="128" font-size="11" fill="#333">Seq B:</text>
  <text x="505" y="128" font-size="11" font-weight="bold" fill="#2e7d32">[DECODE]</text>
  <text x="455" y="141" font-size="10" fill="#666">继续生成</text>

  <rect x="445" y="153" width="135" height="38" rx="4" fill="#e3f2fd" stroke="#2196f3"/>
  <text x="455" y="168" font-size="11" fill="#333">Seq C:</text>
  <text x="505" y="168" font-size="11" font-weight="bold" fill="#1565c0">[PREFILL]</text>
  <text x="455" y="181" font-size="10" fill="#666">立刻补位 ↑</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
</svg>
