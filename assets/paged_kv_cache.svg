<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" font-family="monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Sequence 0 -->
  <rect x="10" y="20" width="150" height="40" rx="4" fill="#e8f0fe" stroke="#4a90d9"/>
  <text x="20" y="37" font-weight="bold" fill="#333">Sequence 0</text>
  <text x="20" y="52" fill="#555">tokens 0-47</text>

  <!-- Sequence 1 -->
  <rect x="10" y="95" width="150" height="40" rx="4" fill="#e8f0fe" stroke="#4a90d9"/>
  <text x="20" y="112" font-weight="bold" fill="#333">Sequence 1</text>
  <text x="20" y="127" fill="#555">tokens 0-31</text>

  <!-- Arrows from sequences to block tables -->
  <line x1="160" y1="40" x2="195" y2="40" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="115" x2="195" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Block Table seq 0 -->
  <rect x="200" y="10" width="180" height="60" rx="4" fill="#fff3cd" stroke="#d4a017"/>
  <text x="210" y="27" font-size="11" font-weight="bold" fill="#333">Block Table (seq 0)</text>
  <rect x="210" y="33" width="36" height="22" rx="2" fill="#ffc107"/>
  <text x="218" y="48" font-size="11" fill="#333">P:3</text>
  <rect x="250" y="33" width="36" height="22" rx="2" fill="#ffc107"/>
  <text x="258" y="48" font-size="11" fill="#333">P:7</text>
  <rect x="290" y="33" width="36" height="22" rx="2" fill="#ffc107"/>
  <text x="298" y="48" font-size="11" fill="#333">P:1</text>
  <text x="340" y="55" font-size="10" fill="#888">逻辑→物理</text>

  <!-- Block Table seq 1 -->
  <rect x="200" y="85" width="180" height="60" rx="4" fill="#fff3cd" stroke="#d4a017"/>
  <text x="210" y="102" font-size="11" font-weight="bold" fill="#333">Block Table (seq 1)</text>
  <rect x="210" y="108" width="36" height="22" rx="2" fill="#ffc107"/>
  <text x="218" y="123" font-size="11" fill="#333">P:5</text>
  <rect x="250" y="108" width="36" height="22" rx="2" fill="#ffc107"/>
  <text x="258" y="123" font-size="11" fill="#333">P:2</text>

  <!-- Arrow from block table 0 down to pool -->
  <line x1="290" y1="70" x2="290" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from block table 1 down to pool -->
  <line x1="290" y1="145" x2="290" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Physical Block Pool -->
  <rect x="60" y="165" width="510" height="95" rx="4" fill="#e6f3e6" stroke="#2d8a2d"/>
  <text x="75" y="182" font-size="12" font-weight="bold" fill="#333">Physical Block Pool</text>

  <!-- Block 0 -->
  <rect x="70" y="195" width="50" height="35" rx="3" fill="#4caf50" opacity="0.9"/>
  <text x="81" y="215" fill="#fff" font-size="10">blk 0</text>
  <text x="76" y="227" fill="#e0ffe0" font-size="9">free</text>

  <!-- Block 1 (seq0 logical 2 → physical 1) -->
  <rect x="128" y="195" width="50" height="35" rx="3" fill="#2196f3" opacity="0.9"/>
  <text x="81" y="215" fill="#fff" font-size="10">P:1</text>
  <text x="76" y="227" fill="#e0ffe0" font-size="9">seq0</text>

  <!-- Block 2 (seq1 → physical 2) -->
  <rect x="186" y="195" width="50" height="35" rx="3" fill="#ff9800" opacity="0.9"/>
  <text x="81" y="215" fill="#fff" font-size="10">P:2</text>
  <text x="76" y="227" fill="#e0ffe0" font-size="9">seq1</text>

  <!-- Block 3 (seq0 logical 0 → physical 3) -->
  <rect x="244" y="195" width="50" height="35" rx="3" fill="#2196f3" opacity="0.9"/>
  <text x="81" y="215" fill="#fff" font-size="10">P:3 ★</text>
  <text x="76" y="227" fill="#e0ffe0" font-size="9">seq0</text>

  <!-- Block 4 -->
  <rect x="302" y="195" width="50" height="35" rx="3" fill="#4caf50" opacity="0.9"/>
  <text x="81" y="215" fill="#fff" font-size="10">blk 4</text>
  <text x="76" y="227" fill="#e0ffe0" font-size="9">free</text>

  <!-- Block 5 (seq1 → physical 5) -->
  <rect x="360" y="195" width="50" height="35" rx="3" fill="#ff9800" opacity="0.9"/>
  <text x="81" y="215" fill="#fff" font-size="10">P:5</text>
  <text x="76" y="227" fill="#e0ffe0" font-size="9">seq1</text>

  <!-- Block 6 -->
  <rect x="418" y="195" width="50" height="35" rx="3" fill="#4caf50" opacity="0.9"/>
  <text x="81" y="215" fill="#fff" font-size="10">blk 6</text>
  <text x="76" y="227" fill="#e0ffe0" font-size="9">free</text>

  <!-- Block 7 (seq0 logical 1 → physical 7) -->
  <rect x="476" y="195" width="50" height="35" rx="3" fill="#2196f3" opacity="0.9"/>
  <text x="81" y="215" fill="#fff" font-size="10">P:7</text>
  <text x="76" y="227" fill="#e0ffe0" font-size="9">seq0</text>

  <!-- Annotations -->
  <text x="265" y="252" font-size="10" fill="#555">↑ seq0 的三个逻辑块散落在物理块 3、7、1</text>
</svg>
